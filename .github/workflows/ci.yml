name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: Offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare trusted runs root
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/lineageguard-runs"

      - name: Prepare advisory PR impact context
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LINEAGEGUARD_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LINEAGEGUARD_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm prepare:pr-impact

      - name: Run offline validation gate
        env:
          LINEAGEGUARD_DEMO_MODE: REPLAY
          LINEAGEGUARD_RUNS_DIR: ${{ runner.temp }}/lineageguard-runs
        run: pnpm verify:offline

      - name: Upload advisory PR impact report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-impact-report
          path: test-results/pr-impact
          if-no-files-found: ignore
          retention-days: 7

      - name: Append advisory PR impact summary
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: pnpm summary:pr-impact

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
